# Gradle 配置
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=false
# 本工程使用跨模块 zipTree 组装单一 mod/agent JAR，与配置缓存的输入追踪不兼容
org.gradle.configuration-cache=false

# NeoForge 环境（与缓存中已存在的 26.3 版本一致）
minecraft_version=26.3
minecraft_version_range=[26.3,26.4)
neo_version=26.3.0.58-beta
# 允许任意 26.3.x 构建，避免钉死在某个 beta
neo_version_range=[26.3.0,)

# 模组元数据
mod_id=vulkanbufferboost
mod_name=VulkanBufferBoost
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.vulkanbufferboost
mod_authors=Ryzezhao
